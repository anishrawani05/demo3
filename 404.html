    <!-- External dependencies (kept as CDN for simplicity) -->

     color: #ff0000;      /* Red */

}

.gif-box{
    text-align:center;

}

.gif-box img{
    width:500px;          /* Apni pasand ka size */

}

.contant_box_404{
    margin-top:10px;      /* -50px hata do */

}

</head>
<body>

    <section class="page_404"> 
        
        <div class="container">
            <div class="row">
                <div class="col-sm-12">

                       <div class="four_zero_four_bg">

</div>

<!-- GIF yahan aayegi -->

</div>

<div class="contant_box_404">

</div>

                    </div>
                </div>
            </div>
        </div>

    <style>
.link_404{
    display:inline-block;
    margin-top:15px;
    padding:14px 30px;
    background:#f80909;
    color:#000000 !important;
    text-decoration:none;
    border-radius:10px;
    font-size:18px;
    font-weight:550;
    font-family:"Poppins", sans-serif;
    transition:.3s;
}

.link_404:hover{
    background:#ed0b03;
    transform:translateY(-3px);
} 
.contant_box_404 h3{
    font-size:42px;
    font-weight:600;
    color:#f70505;
    font-family:"Poppins", cursive;
}

.contant_box_404 p{
    font-size:18px;
    color:#fa0303;
    font-family:"Poppins", sans-serif;
}
